name: Atualizar dados e publicar

on:
  schedule:
    - cron: "0 9 * * *" # 6h no horário de Brasília
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      # tudo do Compras.gov.br (um arquivo por dia, uns 100 MB) mora no cache do Actions, não no repositório;
      # se o cache sumir, o compras.py baixa de novo aos poucos
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: coleta/cache/compras
          key: compras-${{ github.run_id }}
          restore-keys: compras-

      - name: Testar o leitor das decisões do TCU e o reconhecimento de produto
        run: |
          python coleta/teste_valores.py
          python coleta/teste_precos.py

      - name: Decisões novas do TCU (valor de cada candidato e total do país)
        run: |
          python coleta/valores_tcu.py
          python coleta/tcu_total.py

      - name: Compras novas no portal do governo (preço pago a mais)
        run: python coleta/precos.py
        continue-on-error: true # se o portal cair, o resto do site atualiza mesmo assim

      - name: Tudo o que foi comprado pelo Compras.gov.br (catálogo de produtos do governo)
        run: python coleta/compras.py
        continue-on-error: true

      - name: Cruzar tudo (TSE, TCU, CGU, Câmara, Senado, Tesouro, Banco Central)
        run: python coleta/coletar.py

      - name: Guardar no repositório o que mudou
        continue-on-error: true # o GitHub às vezes recusa o push (erro 500): o site publica mesmo assim
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/
          git diff --cached --quiet && exit 0
          git commit -m "Atualiza dados [skip ci]"
          for tentativa in 1 2 3; do git pull --rebase && git push && exit 0; sleep 20; done
          exit 1

      # o site vai para a branch gh-pages num commit só (force_orphan): os dados não acumulam histórico
      - name: Publicar no GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          force_orphan: true
