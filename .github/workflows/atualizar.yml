name: Atualizar dados e publicar

on:
  schedule:
    - cron: "0 9 * * *" # 6h no horário de Brasília
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Testar o leitor das decisões do TCU
        run: python coleta/teste_valores.py

      - name: Decisões novas do TCU (valor de cada candidato e total do país)
        run: |
          python coleta/valores_tcu.py
          python coleta/tcu_total.py

      - name: Compras novas no portal do governo (preço pago a mais)
        run: python coleta/precos.py
        continue-on-error: true # se o portal cair, o resto do site atualiza mesmo assim

      - name: Cruzar tudo (TSE, TCU, CGU, Câmara, Senado, Tesouro, Banco Central)
        run: python coleta/coletar.py

      - name: Guardar no repositório o que mudou
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/
          git diff --cached --quiet || (git commit -m "Atualiza dados [skip ci]" && git pull --rebase && git push)

      # o site vai para a branch gh-pages num commit só (force_orphan): os dados não acumulam histórico
      - name: Publicar no GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          force_orphan: true
