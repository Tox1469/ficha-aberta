name: Atualizar dados e publicar

on:
  schedule:
    - cron: "0 9 * * *" # 6h no horário de Brasília
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Testar o extrator de valores
        run: python coleta/teste_valores.py

      - name: Valores dos acórdãos do TCU (só o ano corrente e o que faltar)
        run: python coleta/valores_tcu.py

      - name: Cruzar TSE, TCU e CGU
        run: python coleta/coletar.py

      - name: Guardar valores novos no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/valores_tcu.json
          git diff --cached --quiet || (git commit -m "Atualiza valores do TCU [skip ci]" && git push)

      # o site vai para a branch gh-pages num commit só (force_orphan): os ~150 MB de dados não acumulam histórico
      - name: Publicar no GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          force_orphan: true
