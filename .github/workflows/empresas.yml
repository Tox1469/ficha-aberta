name: Empresas dos políticos (mensal)

# A Receita Federal publica o cadastro de sócios uma vez por mês (uns 2 GB). O resultado fica em
# dados/empresas_politicos.json.gz e a atualização diária usa esse arquivo.
on:
  schedule:
    - cron: "0 7 20 * *" # dia 20 de cada mês
  workflow_dispatch:

permissions:
  contents: write

jobs:
  empresas:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python coleta/empresas.py
      - name: Guardar no repositório (a atualização diária publica no dia seguinte)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/empresas_politicos.json.gz
          git diff --cached --quiet || (git commit -m "Atualiza empresas dos políticos" && git pull --rebase && git push)
