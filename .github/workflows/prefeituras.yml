name: Contas das prefeituras (mensal)

# A API do Tesouro limita o ritmo: ler as 5.570 cidades leva horas. Conta anual muda pouco, então uma vez por mês basta.
on:
  schedule:
    - cron: "0 6 2 * *" # dia 2 de cada mês
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prefeituras:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python coleta/prefeituras.py
      - name: Guardar no repositório (a atualização diária publica no dia seguinte)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/prefeituras.json
          git diff --cached --quiet || (git commit -m "Atualiza contas das prefeituras" && git pull --rebase && git push)
